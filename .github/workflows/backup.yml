name: Nightly backup

on:
  schedule:
    - cron: '17 9 * * *'  # 09:17 UTC daily (early morning in US time zones)
  workflow_dispatch:      # "Run workflow" button for an on-demand backup

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backup.mjs
      - name: Commit if anything changed
        run: |
          git add backup
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly backup $(date -u +%F)"
          git push
